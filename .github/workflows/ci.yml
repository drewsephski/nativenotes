name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nativenotes_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: nativenotes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nativenotes_test -d nativenotes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nativenotes_test:ephemeral-ci-only@127.0.0.1:5432/nativenotes_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Backend validation
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - name: Web validation
        run: pnpm --filter web exec next typegen && pnpm --filter web lint && pnpm --filter web typecheck && pnpm --filter web test && pnpm --filter web build
        env:
          NATIVE_NOTES_BACKEND_ORIGIN: https://nativenotes.vercel.app
          NEXT_PUBLIC_WEB_ORIGIN: https://nativenotes.app
      - name: Whitespace validation
        run: git diff --check
